[package]
name = "tauri-appwinisd"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_appwinisd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
nalgebra = "0.33"
num-complex = "0.4"
base64 = "0.22"
# The alignment grid is embarrassingly parallel: every candidate is an independent
# circuit solve. Winner selection stays sequential so results remain deterministic.
rayon = "1"


# The solver is the whole app, so the release build is tuned for it: whole-program
# LTO and a single codegen unit let the optimiser see across nalgebra's generics into
# solve_circuit's inner loop.
#
# Deliberately no `panic = "abort"`. solve_circuit has reachable NaN and singular-matrix
# paths, and those want to surface as an error the frontend can show, not as a killed
# process.
[profile.release]
lto = "fat"
codegen-units = 1

# `tauri dev` is where a developer forms an opinion about whether the solver feels
# fast, and it was by a wide margin the build where it was slowest: the 20 alignment
# tests took 31.8 s here against 1.5 s in release.
#
# Optimising only dependencies barely helped — 31.8 s to 25.3 s — because nalgebra is
# generic, so its hot code is monomorphised into *this* crate and compiles at this
# crate's opt-level, not its own. Optimising our crate too is what closes the gap:
# 1.9 s, near release, for no measurable cost per edit. A warm one-line rebuild is
# 1.48 s at opt-level 1 against 1.72 s at 0; the whole edit-to-test cycle is 2 s wall
# clock. Only the one-off rebuild when this profile changes is slow.
#
# opt-level 1 rather than 3 on purpose: it keeps debuginfo useful and inlining
# legible, and the remaining distance to release is not worth the compile time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# `test` gives us mock_builder/mock_context so the storage-scope guard can be
# exercised against a real fs scope rather than a hand-rolled stand-in.
tauri = { version = "2", features = ["test"] }

# Warnings are denied in CI (`cargo clippy --all-targets -- -D warnings`), so a new
# lint fails the build rather than scrolling past. The handful of standing exceptions
# are `#[allow]`ed at the site with the reason, not silenced from here.
[lints.clippy]
all = "warn"
